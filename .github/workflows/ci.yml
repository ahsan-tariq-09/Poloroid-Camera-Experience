name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  browser:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [cdp, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The cdp engine launches the runner's preinstalled Google Chrome.
      - if: matrix.engine == 'webkit'
        run: pnpm exec playwright install --with-deps webkit
      - name: Serve the build
        run: |
          pnpm preview --port 5174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5174/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: pnpm test:browser ${{ matrix.engine }} camera-browser-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-browser-${{ matrix.engine }}
          path: camera-browser-results
